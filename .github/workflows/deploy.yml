name: deploy-pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  verify:
    if: github.ref == 'refs/heads/main' && github.repository == 's950449/TWPayQRCodeGenerator'
    permissions:
      contents: read
    uses: ./.github/workflows/test.yml

  package:
    needs: verify
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      # Publish only the files the site serves; internal docs under docs/ stay out of Pages.
      - name: Stage allowlisted site files
        run: |
          site="$RUNNER_TEMP/site"
          mkdir "$site"
          cp -R docs/index.html docs/css docs/js docs/vendor docs/data "$site/"
          if find "$site" -type l | grep -q .; then
            echo "Symlinks are not allowed in the Pages artifact" >&2
            exit 1
          fi
      - uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: ${{ runner.temp }}/site
          retention-days: 1

  deploy:
    needs: package
    permissions:
      pages: write
      id-token: write
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # No checkout, package installation, or repository code in this privileged job.
      - name: Deploy this run's Pages artifact
        id: deployment
        uses: actions/deploy-pages@v5.0.1
